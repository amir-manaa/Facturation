<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content [innerHTML]="data.content">
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close [mat-dialog-close]="false">Non</button>
  <button mat-button mat-dialog-close [mat-dialog-close]="true">{{ data.confirmButton }}</button>
</mat-dialog-actions>
